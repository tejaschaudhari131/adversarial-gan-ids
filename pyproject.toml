[project]
name = "adversarial-gan-ids"
version = "0.2.0"
description = "Research toolkit for adversarial robustness of ML/DL intrusion detection systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", ".venv", "artifacts", "results", "data"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]
